name: Mutation Testing

on:
  schedule:
    # Run weekly every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: mutation-testing
  cancel-in-progress: true

jobs:
  mutate:
    name: Stryker Mutation Testing (vimsplain)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stryker mutation tests
        run: pnpm --filter vimsplain test:mutate

      - name: Upload mutation report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: packages/vimsplain/reports/mutation/
          retention-days: 14
