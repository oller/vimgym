name: Mutation Testing

on:
  schedule:
    # Run weekly every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: mutation-testing
  cancel-in-progress: true

jobs:
  mutate:
    name: Stryker Mutation Testing (vimsplain)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore previous mutation report
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/vimsplain/reports/mutation/baseline.json
            packages/vimsplain/reports/stryker-incremental.json
          key: stryker-weekly-baseline-${{ github.sha }}
          restore-keys: |
            stryker-weekly-baseline-

      - name: Run Stryker mutation tests
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: "true"
        run: pnpm --filter vimsplain test:mutate

      - name: Update or create evergreen issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: node .github/scripts/update-mutation-issue.mjs

      - name: Prepare baseline report
        if: always()
        run: |
          if [ -f packages/vimsplain/reports/mutation/mutation.json ]; then
            mkdir -p packages/vimsplain/reports/mutation
            cp packages/vimsplain/reports/mutation/mutation.json packages/vimsplain/reports/mutation/baseline.json
          fi

      - name: Save mutation report for next run's delta
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            packages/vimsplain/reports/mutation/baseline.json
            packages/vimsplain/reports/stryker-incremental.json
          key: stryker-weekly-baseline-${{ github.sha }}

      - name: Upload mutation report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: packages/vimsplain/reports/mutation/
          retention-days: 14
