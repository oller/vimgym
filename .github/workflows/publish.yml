name: Publish

on:
  push:
    branches: [main]
    paths:
      - "packages/vimsplain/**"
      - ".changeset/**"
      - ".github/workflows/publish.yml"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write      # create release commits and tags
      pull-requests: write # changesets bot opens version PRs
      id-token: write      # mint OIDC token for npm provenance attestations
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vimsplain
        run: pnpm --filter vimsplain build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm changeset publish
          commit-message: "Version Packages [skip ci]"
          pr-title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Attach provenance attestations (links published tarball to this
          # exact commit and workflow run via Sigstore transparency log).
          NPM_CONFIG_PROVENANCE: "true"
