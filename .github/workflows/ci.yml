name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck vimsplain
        run: pnpm --filter vimsplain typecheck

      - name: Test vimsplain with coverage
        run: pnpm --filter vimsplain test:coverage

      - name: Build vimsplain
        run: pnpm --filter vimsplain build

      - name: Typecheck app
        run: pnpm tsc

      - name: Test app
        run: pnpm test:run
