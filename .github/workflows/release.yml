name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create release commits and tags
      pull-requests: write # changesets bot opens version PRs
      id-token: write      # trusted publishing: mint OIDC token for npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # No registry-url here — it would inject NODE_AUTH_TOKEN into .npmrc
          # which conflicts with OIDC trusted publishing token exchange.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vimsplain
        run: pnpm --filter vimsplain build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish --no-git-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted publishing: no NPM_TOKEN needed.
          # npm authenticates via the OIDC id-token minted above.
          # NPM_CONFIG_PROVENANCE tells `changeset publish` (which calls
          # `npm publish` internally) to attach provenance attestations.
          NPM_CONFIG_PROVENANCE: "true"
